services:
  faction-mcp:
    image: factionsecurityllc/faction-mcp:latest
    platform: linux/amd64
    pull_policy: always
    stdin_open: true
#   NODE_EXTRA_CA_CERTS: /certs/ca-bundle.crt
    environment:
      FACTION_API_KEY: ${FACTION_API_KEY}
      FACTION_BASE_URL: ${FACTION_BASE_URL}
      # In-container mount point. Used both for downloaded reports and as the
      # staging directory for image uploads (the MCP server reads images here).
      FACTION_REPORTS_DIR: /app/reports
      # Host-side path of the volume mount below. Reported back to the MCP
      # client as `file_path` so the user can open downloaded reports directly,
      # and used by upload_assessment_image to translate host paths the LLM
      # passes (e.g. /tmp/foo.png) to their in-container equivalent.
      FACTION_REPORTS_HOST_DIR: ${FACTION_REPORTS_HOST_DIR:-/tmp}
    volumes:
      # Reports land here on your host AND this is where the LLM should `cp`
      # images before calling upload_assessment_image. Override by setting
      # FACTION_REPORTS_HOST_DIR in .env.
      - ${FACTION_REPORTS_HOST_DIR:-/tmp}:/app/reports
# Uncomment this section and NODE_EXTRA_CA_CERTS if
#   your company uses internal or custom CA's
#      - /path/to/your/custom/ca-bundle.crt:/certs/ca-bundle.crt:ro
